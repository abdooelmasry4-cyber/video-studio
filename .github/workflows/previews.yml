name: Make previews for old videos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - name: Light copies + posters for videos that have none
        env: {GH_TOKEN: '${{ github.token }}', R: '${{ github.repository }}'}
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          gh api repos/$R/releases/tags/videos -q '.assets[].name' > names.txt
          mkdir -p o
          for f in $(grep -E '\.mp4$' names.txt | grep -v '\.preview\.mp4$'); do
            b="${f%.mp4}"; grep -qx "$b.preview.mp4" names.txt && continue
            gh release download videos -R $R -p "$f" -D d --clobber
            ffmpeg -v error -y -i "d/$f" -map 0:v:0 -map 0:a? -vf "scale='if(gt(iw,ih),1280,720)':-2:flags=lanczos" -c:v libx264 -preset veryfast -crf 24 -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "o/$b.preview.mp4"
            grep -qx "$b.jpg" names.txt || ffmpeg -v error -y -ss 1 -i "d/$f" -frames:v 1 -vf "scale=720:-2" -q:v 3 "o/$b.jpg"
            gh release upload videos -R $R o/* --clobber; rm -rf o/* d
          done
