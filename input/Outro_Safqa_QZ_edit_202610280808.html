:root{--bg:#0F1320;--up:#26A69A;--dn:#EF5350;--acc:#F5C518}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070c;font-family:'Alexandria',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;user-select:none}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{background:var(--acc);color:#111;border:2px solid #000;padding:7px 18px;border-radius:9px;font:800 14px 'Alexandria';cursor:pointer;box-shadow:3px 3px 0 #000}
.btn.alt{background:#fff}
.time{font:600 13px monospace;color:#9ab;direction:ltr}
.reel{width:405px;height:720px;max-width:calc(100vw - 32px);aspect-ratio:9/16;background:var(--bg);border-radius:18px;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);container-type:inline-size}
.reel>*{position:absolute}
#cv{inset:0;width:100%;height:100%}
.logo{right:2.6cqw;top:1.4cqw;width:9cqw;opacity:.95}
.vig{inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(239,83,80,.55) 100%);mix-blend-mode:screen}
.dim{inset:0;background:rgba(8,10,18,.82);opacity:0}
.cap{left:4cqw;right:4cqw;top:150cqw;text-align:center;font:900 7.4cqw/1.35 'Cairo','Alexandria',sans-serif;color:#fff;text-shadow:0 .5cqw 1.6cqw rgba(0,0,0,.8);direction:rtl}
.cap span{display:inline-block;margin:0 .9cqw}
.cap span.hidden{opacity:0}
.cap span.k1{color:var(--acc)} .cap span.k2{color:var(--dn)} .cap span.k3{color:var(--up)}
.cap span.pop{transform:scale(1.18)}
/* overlay pieces */
.o{opacity:0}
.ttl{white-space:nowrap;left:0;right:0;text-align:center;font-family:'Cairo',sans-serif;font-weight:900;color:#fff;line-height:1.1;text-shadow:0 .8cqw 2.4cqw rgba(0,0,0,.7)}
.chip{white-space:nowrap;display:inline-block;padding:1.2cqw 3.6cqw;border-radius:2.4cqw;font:800 5.2cqw 'Alexandria';color:#fff}
.strike{position:absolute;left:-3%;top:52%;height:1.3cqw;width:106%;background:var(--dn);border-radius:1cqw;transform-origin:right center}
.card{left:6cqw;right:6cqw;background:rgba(18,23,38,.94);border:.4cqw solid rgba(255,255,255,.12);border-radius:4cqw;box-shadow:0 3cqw 8cqw rgba(0,0,0,.55);padding:4cqw 5cqw;text-align:center}
.card *{position:relative}
.list{left:6cqw;right:6cqw;top:28cqw;height:112cqw;background:#121726;border:.4cqw solid rgba(255,255,255,.1);border-radius:5cqw;box-shadow:0 4cqw 10cqw rgba(0,0,0,.6);overflow:hidden}
.list>*{position:absolute}
.row{left:5cqw;right:5cqw;height:16cqw;border-radius:3.4cqw;background:#1A2033;border:.35cqw solid rgba(255,255,255,.07);display:flex;align-items:center;gap:3.4cqw;padding:0 3.4cqw;direction:rtl}
.row .ic{width:10cqw;height:10cqw;border-radius:2.6cqw;flex:none;display:flex;align-items:center;justify-content:center}
.row .ic svg{width:6.4cqw;height:6.4cqw}
.row .tx{flex:1;white-space:nowrap;text-align:right;font:900 5cqw/1.2 'Cairo';color:#fff}
.row .tx small{display:block;font:600 3.4cqw 'Alexandria';color:#8D93A8}
.row .ck{width:7.4cqw;height:7.4cqw;border-radius:50%;border:.5cqw solid #39405A;flex:none;position:relative}
.row .ck b{position:absolute;inset:-.5cqw;border-radius:50%;background:var(--up);display:flex;align-items:center;justify-content:center;opacity:0}
.row .ck b svg{width:4.4cqw;height:4.4cqw}
.box{left:12cqw;right:12cqw;height:17cqw;border-radius:3.6cqw;display:flex;align-items:center;justify-content:center;font:900 9cqw 'Cairo';color:#fff}
.avt{position:relative;width:15cqw;height:15cqw;border-radius:50%;background:linear-gradient(135deg,#2962FF,#26A69A);border:.7cqw solid var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5cqw rgba(255,255,255,.15)}
.avt svg{width:9cqw;height:9cqw}
.sig{left:8cqw;right:8cqw;height:17cqw;border-radius:4cqw;background:rgba(24,29,46,.97);border:.35cqw solid rgba(255,255,255,.12);box-shadow:0 2.4cqw 6cqw rgba(0,0,0,.55);display:flex;align-items:center;gap:3cqw;padding:0 3.6cqw;direction:rtl}
.sig *{position:relative}
.sig .bl{width:10cqw;height:10cqw;border-radius:3cqw;background:#2962FF;display:flex;align-items:center;justify-content:center;flex:none}.sig .bl svg{width:6cqw;height:6cqw}
.sig .sx{flex:1;text-align:right}.sig .sx b{display:block;font:900 5.4cqw/1.2 'Cairo';color:#fff}.sig .sx small{display:block;font:600 3.6cqw Arial,sans-serif;color:#9AA0B4;text-align:right}
.sig .tag{font:800 3.8cqw Arial,sans-serif;color:#fff;padding:1cqw 2.4cqw;border-radius:2cqw}
.cbox{left:9cqw;right:9cqw;background:#161b2b;border:.3cqw solid #2a3146;border-radius:4cqw;padding:3.4cqw;display:flex;align-items:center;gap:2.6cqw;direction:rtl}
.cbox *{position:relative}
.cbox .av{width:9cqw;height:9cqw;border-radius:50%;background:var(--acc);flex:none;display:flex;align-items:center;justify-content:center;font:900 4cqw 'Cairo';color:#111}
.cbox .in{flex:1;height:9cqw;border-radius:5cqw;background:#0f1320;border:.3cqw solid #2a3146;display:flex;align-items:center;padding:0 3cqw;font:800 4.6cqw 'Alexandria';color:#fff}
.cbox .in i{display:inline-block;width:.4cqw;height:5cqw;background:#fff;margin-right:.5cqw}
.cbox .snd{width:9cqw;height:9cqw;border-radius:50%;background:#2962FF;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font:900 4.4cqw sans-serif}
.flash{inset:0;background:#fff;opacity:0;pointer-events:none}

.ctl{width:405px;max-width:calc(100vw - 32px);background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:8px;font-family:'Alexandria',sans-serif}
.ctl .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctl .row b{font:700 12.5px 'Alexandria';color:#222;white-space:nowrap}
.ctl .sw{display:flex;gap:6px}
.ctl .sw button{width:26px;height:26px;border-radius:50%;border:2px solid #ddd;cursor:pointer;padding:0}
.ctl .sw button[aria-pressed="true"]{outline:3px solid #111;outline-offset:2px}
.ctl .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.ctl .msg{font:600 12px 'Alexandria';color:#555;text-align:center;min-height:16px}
.rec-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e11d48;margin-left:6px;animation:recb 1s steps(1) infinite}
@keyframes recb{50%{opacity:.2}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn" id="play" type="button">▶ تشغيل</button>
  <button class="btn alt" id="restart" type="button">↺ من الأول</button>
  <span class="time" id="time">0.0</span>
</div>

  if (P.a > .5 && t < 47.14) { const v = Math.round((last.c - ENTRY) * 12); pill(`LONG 1.00  ${v >= 0 ? '+' : '−'}$${Math.abs(v)}`, 480, 235, v >= 0 ? hexA(UP, .9) : hexA(DN, .9), '#fff', '700 21px Arial', 'left', 12); }

  /* ---- left toolbar ---- */
  g.fillStyle = BG; g.fillRect(0, 120, AX, AB - 60);
  g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,.08)'; g.beginPath(); g.moveTo(AX, 120); g.lineTo(AX, AB + 50); g.stroke();
  const toolOn = t >= 2.9 && t < 3.0;
  for (let k = 0; k < 8; k++) icon(k, 38, 158 + k * 76, TXT, (k === 4 && toolOn));
  if (t >= 2.6 && t < 3.05) { const a = ease(prog(t, 2.6, .12)); g.globalAlpha = a; pill('Long Position', 76 + 14, 462, '#2A2E39', '#E8EAF0', '500 21px Arial', 'left', 12); g.globalAlpha = 1; }

  /* ---- bottom app bar ---- */
  g.fillStyle = '#0B0E17'; g.fillRect(-30, 1820, 1140, 130);
  g.strokeStyle = 'rgba(255,255,255,.07)'; g.beginPath(); g.moveTo(0, 1820); g.lineTo(1080, 1820); g.stroke();
  g.font = '500 20px Arial'; g.textAlign = 'center';
  ['Watchlist', 'Chart', 'Explore', 'Ideas', 'Menu'].forEach((n, k) => { const x = 108 + k * 216; g.fillStyle = k === 1 ? '#E8EAF0' : DIM; g.strokeStyle = g.fillStyle; g.lineWidth = 2.4; g.beginPath(); if (k === 1) { g.moveTo(x - 14, 1866); g.lineTo(x - 4, 1852); g.lineTo(x + 4, 1860); g.lineTo(x + 14, 1844); } else { g.rect(x - 12, 1844, 24, 22); } g.stroke(); g.fillText(n, x, 1894); });

  /* ---- crosshair + cursor ---- */
  const hide = t >= 4.6 ? prog(t, 4.6, .3) : 0;
  const [cx, cy] = cursorAt(t);
  if (hide < 1) {
    g.globalAlpha = 1 - hide;
    if (cx > AX && cx < AR && cy > AY && cy < AB) {
      g.setLineDash([5, 6]); g.strokeStyle = 'rgba(178,181,190,.55)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(AX, cy); g.lineTo(AR, cy); g.moveTo(cx, AY - 10); g.lineTo(cx, AB); g.stroke(); g.setLineDash([]);
      const pp = PMAX - (cy - AY) / (AB - AY) * (PMAX - PMIN); pill(fmt(pp), AR + 4, cy, '#363A45', '#fff', '500 22px Arial', 'left', 8);
    }
    for (const c of CLICKS) if (t >= c && t < c + .35) { const q = prog(t, c, .35); g.strokeStyle = `rgba(91,140,255,${1 - q})`; g.lineWidth = 3; g.beginPath(); g.arc(cx, cy, 10 + q * 34, 0, 7); g.stroke(); }
    const down = CLICKS.some(c => t >= c && t < c + .12) || DOWNS.some(([a, b]) => t >= a && t < b);
    g.save(); g.translate(cx, cy); g.scale(down ? 1.22 : 1.4, down ? 1.22 : 1.4);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 30); g.lineTo(7.5, 23); g.lineTo(12.5, 34); g.lineTo(17, 32); g.lineTo(12, 21.5); g.lineTo(21.5, 21.5); g.closePath();
    g.fillStyle = '#fff'; g.fill(); g.strokeStyle = '#000'; g.lineWidth = 1.6; g.stroke(); g.restore();
    g.globalAlpha = 1;
  }
  /* ---- coins ---- */
  if (t >= 33.26 && t < 35.4) {
    const dt = t - 33.26;
    for (const c of COIN) { const x = c.x + c.vx * dt, y = c.y + c.vy * dt + 1300 * dt * dt; g.save(); g.translate(x, y); g.rotate(c.r + dt * 8); g.globalAlpha = 1 - prog(t, 34.8, .6); g.fillStyle = c.c; g.beginPath(); g.ellipse(0, 0, c.s / 2, c.s / 2 * Math.abs(Math.cos(dt * 9 + c.r)) + 2, 0, 0, 7); g.fill(); g.restore(); }
    g.globalAlpha = 1;
  }

  /* ---- html layers ---- */
  fx(t);
  $('#vig').style.opacity = Math.max(win(t, 37.6, 39.8, .1, .5) * .9, win(t, 43.3, 47.14, .3, .3) * (.7 + .3 * Math.sin(t * 7)), win(t, 45.2, 46.2, .05, .6));
  $('#dim').style.opacity = win(t, 4.65, 99, .35, .1) * .9;
  const typed = [...'صفقة'].slice(0, Math.round(prog(t, 5.75, .55) * 4)).join(''); $('#cin').innerHTML = typed + (t < 6.4 && Math.floor(t * 3) % 2 === 0 ? '<i></i>' : '');
  $('#flash').style.opacity = FLASH.some(f => t >= f && t < f + .09) ? .2 : 0;
  $('#time').textContent = `${tn.toFixed(1)} / ${DUR.toFixed(1)}`;

  /* ---- captions ---- */
  const cap = $('#cap');
  let pi = -1; for (let i = 0; i < PAGES.length; i++) if (tn >= WORDS[PAGES[i][0]][1] - .05) pi = i;
  if (pi < 0) { cap.innerHTML = ''; lastPage = -1; return; }
  const [a, b] = PAGES[pi]; const end = Math.min(pi + 1 < PAGES.length ? WORDS[PAGES[pi + 1][0]][1] - .05 : DUR, WORDS[b][1] + 1.3);
  if (tn > end) { cap.innerHTML = ''; lastPage = -1; return; }
  if (lastPage !== pi) { cap.innerHTML = WORDS.slice(a, b + 1).map(w => `<span>${w[0].replace(/[.،:]$/, '')}</span>`).join(' '); lastPage = pi; }
  [...cap.children].forEach((sp, i) => { const w = WORDS[a + i]; const on = tn >= w[1] - .04;
    sp.className = !on ? 'hidden' : (w[2] ? 'k' + w[2] : '') + (w[2] && tn < w[1] + .18 ? ' pop' : ''); });
}
/* loop driven by audio clock */
let raf = null, fallbackStart = null;
function loop(){ const t = vo.paused && fallbackStart === null ? vo.currentTime : (vo.paused ? (performance.now() - fallbackStart) / 1000 : vo.currentTime); render(t); if (t < DUR) raf = requestAnimationFrame(loop); }
function play(){ cancelAnimationFrame(raf); vo.play().then(() => { fallbackStart = null; loop(); }).catch(() => { fallbackStart = performance.now() - vo.currentTime * 1000; loop(); }); $('#play').textContent = '⏸ إيقاف'; }
function pause(){ vo.pause(); cancelAnimationFrame(raf); fallbackStart = null; $('#play').textContent = '▶ تشغيل'; }
$('#play').onclick = () => vo.paused ? play() : pause();
$('#restart').onclick = () => { vo.currentTime = 0; lastPage = -1; play(); };
vo.onended = () => { $('#play').textContent = '▶ تشغيل'; };
document.fonts.ready.then(() => render(vo.currentTime || 0.6));
render(0.6);

/* ===== colour controls ===== */
const PALETTE = [{"v": "--up", "label": "الصعود", "opts": ["#26A69A", "#22C55E", "#00C2A8", "#3B82F6", "#A3E635"]}, {"v": "--dn", "label": "الهبوط", "opts": ["#EF5350", "#DC2626", "#F43F5E", "#F97316", "#A855F7"]}, {"v": "--bg", "label": "الخلفية", "opts": ["#0F1320", "#131722", "#0B0E14", "#111827", "#1A1F2E"]}, {"v": "--acc", "label": "المميز", "opts": ["#F5C518", "#FFD60A", "#FB923C", "#7CD4FF", "#FFFFFF"]}];
const reelEl = document.getElementById('reel');
function applyCol(v, c){ reelEl.style.setProperty(v, c); document.documentElement.style.setProperty(v, c); }
function buildSw(){
  const box = document.getElementById('swRows'); box.innerHTML = '';
  PALETTE.forEach(p => {
    const cur = getComputedStyle(reelEl).getPropertyValue(p.v).trim().toUpperCase() || p.opts[0];
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<b>${p.label}</b><div class="sw">${p.opts.map(c => `<button type="button" aria-label="${c}" aria-pressed="${cur === c.toUpperCase()}" style="background:${c}" data-c="${c}"></button>`).join('')}</div>`;
    row.querySelectorAll('button').forEach(b => b.onclick = () => { applyCol(p.v, b.dataset.c); buildSw(); });
    box.appendChild(row);
  });
}
document.getElementById('resetCol').onclick = () => { PALETTE.forEach(p => applyCol(p.v, p.opts[0])); buildSw(); };
buildSw();

/* ===== prompt for final render + save baked HTML ===== */
const STYLE_NAME = 'تطلع ولا تنزل؟ (QZ)';
function chosen(){ return PALETTE.map(p => ({v: p.v, label: p.label, c: (getComputedStyle(reelEl).getPropertyValue(p.v).trim() || p.opts[0]).toUpperCase()})); }
document.getElementById('copyPrompt').onclick = () => {
  const cols = chosen();
  const txt = `طلب الفيديو النهائي\nالقالب: ${STYLE_NAME}\nالملف: ${document.title.split('|')[0].trim()}\nالألوان:\n${cols.map(c => `- ${c.label}: ${c.c} (${c.v})`).join('\n')}\nالصوت: نفس صوت أحمد الموجود في الملف\nالمطلوب: طلّعلي الفيديو النهائي MP4 بأعلى جودة (1080×1920) بنفس المشاهد والحركة دي وبالألوان دي.`;
  const done = () => recMsg('✓ البرومت اتنسخ. ابعتهولي في الشات.');
  navigator.clipboard.writeText(txt).then(done).catch(() => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { recMsg('النسخ مش متاح، انسخ من هنا:<br><textarea style="width:100%;height:120px">' + txt + '</textarea>'); } ta.remove(); });
};
document.getElementById('bakeHtml').onclick = () => {
  const clone = document.documentElement.cloneNode(true);
  ['nums', 'month', 'donut', 'tower', 'sA', 'sB', 'cap', 'swRows'].forEach(id => { const el = clone.querySelector('#' + id); if (el) el.innerHTML = ''; });
  clone.querySelectorAll('.on, .in, .hidden').forEach(el => el.classList.remove('on', 'in', 'hidden'));
  const cols = chosen(); const css = ':root{' + cols.map(c => `${c.v}:${c.c}`).join(';') + '}';
  const st = clone.querySelector('#baked') || Object.assign(document.createElement('style'), {id: 'baked'}); st.textContent = css; clone.querySelector('head').appendChild(st);
  clone.querySelector('#reel').removeAttribute('style'); clone.removeAttribute('style');
  // the baked colours become the new defaults
  const html = '<!DOCTYPE html>\n' + clone.outerHTML.replace(/const PALETTE = (\[[\s\S]*?\]);/, (m, arr) => { try { const P = JSON.parse(arr); P.forEach(p => { const c = cols.find(x => x.v === p.v).c; p.opts = [c, ...p.opts.filter(o => o.toUpperCase() !== c)].slice(0, 5); }); return 'const PALETTE = ' + JSON.stringify(P) + ';'; } catch (e) { return m; } });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
  a.download = document.title.split('|')[0].trim().replace(/\s+/g, '_') + '_final.html'; document.body.appendChild(a); a.click(); a.remove();
  recMsg('✓ اتحفظ ملف بالألوان دي. ارفعه على أداة الريندر علشان يطلع MP4 بأعلى جودة.');
};

/* ===== record to video (tab capture cropped to the reel + voice) ===== */
let mediaSrc = null, actx = null;
const recMsg = t => document.getElementById('recMsg').innerHTML = t;
document.getElementById('recBtn').onclick = async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder) { recMsg('المتصفح ده مش بيدعم التحميل. افتح الملف في كروم أو إيدج على الكمبيوتر.'); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({video: {displaySurface: 'browser', frameRate: 30}, audio: false, preferCurrentTab: true, selfBrowserSurface: 'include'});
  } catch (e) { recMsg('اتلغى. لما تظهر نافذة المشاركة اختار «التاب دي» واضغط Share.'); return; }
  const track = stream.getVideoTracks()[0];
  const old = {w: reelEl.style.width, h: reelEl.style.height};
  const H = Math.min(window.innerHeight - 30, 1280), Wd = Math.round(H * 9 / 16);
  reelEl.style.width = Wd + 'px'; reelEl.style.height = H + 'px'; reelEl.scrollIntoView({block: 'center'});
  await new Promise(r => setTimeout(r, 400));
  try { if (window.CropTarget && track.cropTo) await track.cropTo(await CropTarget.fromElement(reelEl)); } catch (e) {}
  if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); mediaSrc = actx.createMediaElementSource(vo); }
  const dest = actx.createMediaStreamDestination(); mediaSrc.disconnect(); mediaSrc.connect(dest); mediaSrc.connect(actx.destination);
  await actx.resume();
  const mixed = new MediaStream([track, ...dest.stream.getAudioTracks()]);
  const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(mixed, mime ? {mimeType: mime, videoBitsPerSecond: 10000000} : {});
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); reelEl.style.width = old.w; reelEl.style.height = old.h;
    const ext = (rec.mimeType || mime).includes('mp4') ? 'mp4' : 'webm';
    const url = URL.createObjectURL(new Blob(chunks, {type: rec.mimeType || 'video/webm'}));
    const a = document.createElement('a'); a.href = url; a.download = document.title.split('|')[0].trim().replace(/\s+/g, '_') + '.' + ext; document.body.appendChild(a); a.click(); a.remove();
    recMsg(`✓ اتحمّل الفيديو (${ext.toUpperCase()}). لو ما نزلش، <a href="${url}" download="video.${ext}">اضغط هنا</a>.`);
  };
  vo.pause(); vo.currentTime = 0; lastPage = -1; render(0);
  await new Promise(r => setTimeout(r, 500));
  rec.start(250); recMsg('<span class="rec-dot"></span> بيسجّل… سيب التاب مفتوحة لحد ما الفيديو يخلص.');
  play();
  const stopAt = () => { setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, 1600); };
  vo.addEventListener('ended', stopAt, {once: true});
  track.addEventListener('ended', () => { if (rec.state !== 'inactive') rec.stop(); }, {once: true});
};
