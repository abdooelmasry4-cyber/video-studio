<script>
var DUR = 20; window.DUR = DUR;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const back = (k) => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
function kf(t, keys, fn = ease) { // keys [[t,v],...] v number or array
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const [t0, v0] = keys[i - 1], [t1, v1] = keys[i], k = fn((t - t0) / (t1 - t0));
    return Array.isArray(v0) ? v0.map((v, j) => lerp(v, v1[j], k)) : lerp(v0, v1, k);
  }
  return keys[keys.length - 1][1];
}

      bob = Math.abs(sw) * 4;
      ra = [[26, -118], [30, -76]]; la = [[-26, -118], [-30, -76]];
      rl = [[16, -42], [22, 0]]; ll = [[-16, -42], [-22, 0]]; }
  }
  const up = (p) => [p[0], p[1] - bob];
  [hip, neck, head] = [up(hip), up(neck), up(head)];
  if (o.pose !== 'climb' && o.pose !== 'fall' && o.pose !== 'flat') { la = la.map(up); ra = ra.map(up); }
  const sh = [neck[0], neck[1] + 14];
  const path = `M${P(...hip)} L${P(...neck)} M${P(...sh)} L${P(...la[0])} L${P(...la[1])} M${P(...sh)} L${P(...ra[0])} L${P(...ra[1])} M${P(...hip)} L${P(...ll[0])} L${P(...ll[1])} M${P(...hip)} L${P(...rl[0])} L${P(...rl[1])}`;
  const rot = o.rot || 0;
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s}) rotate(${rot} 0 -90)" opacity="${o.op ?? 1}">
    <path d="${path}" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="${(head[0] * d).toFixed(1)}" cy="${head[1].toFixed(1)}" r="27" fill="${col}"/></g>`;
}

/* ---------- static world ---------- */
function world(t) {
  let h = '';
  // dust specks
  for (let i = 0; i < 46; i++) {
    const x = hash(i) * 1080, y = ((hash(i + 50) * 2200 + t * (12 + hash(i + 9) * 18)) % 2200) - 140;
    h += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(1.5 + hash(i + 3) * 2.5).toFixed(1)}" fill="#fff" opacity="${(.05 + hash(i + 7) * .12).toFixed(2)}"/>`;
  }
  // left cliff (crowd)
  h += `<path d="M-200 1180 L300 1180 L292 1260 L304 1340 L288 1460 L300 1600 L290 1760 L300 2300 L-200 2300Z" fill="url(#rock)"/>`;
  h += `<path d="M-200 1180 L300 1180" stroke="#3a3a3a" stroke-width="4"/>`;
  // ground right of pillar + gap ground
  h += `<path d="M300 ${GROUND} L1400 ${GROUND} L1400 2300 L300 2300Z" fill="url(#rock)"/><path d="M300 ${GROUND} L1400 ${GROUND}" stroke="#3a3a3a" stroke-width="4"/>`;
  // pillar
  h += `<rect x="${PX0}" y="${PTOP}" width="${PX1 - PX0}" height="${2300 - PTOP}" fill="url(#pil)"/>`;
  h += `<path d="M${PX0} ${PTOP} ` + Array.from({length: 40}, (_, i) => `L${PX0 + (hash(i + 90) - .5) * 8} ${PTOP + i * 45}`).join(' ') + `" stroke="#3c3c3c" stroke-width="3" fill="none"/>`;
  h += `<rect x="${PX0 - 6}" y="${PTOP - 10}" width="${PX1 - PX0 + 12}" height="14" rx="3" fill="#3a3a3a"/>`;
  return h;
}

/* ---------- character timelines ---------- */
// A: patient climber on the pillar's left face
function stateA(t) {
  if (t < 2) return {x: 372, y: GROUND, pose: 'stand', ph: t * 3, dir: 1};
  if (t < 16.2) {
    const y = kf(t, [[2, GROUND], [10, 1300], [13, 1185], [16.2, 590]], (k) => k);
    return {x: 376, y, pose: 'climb', ph: t * 5.4, dir: 1};
  }
  if (t < 16.8) { const k = ease(seg(t, 16.2, 16.8)); return {x: lerp(376, 500, k), y: lerp(590, PTOP, k) - Math.sin(k * Math.PI) * 50, pose: 'climb', ph: t * 7, dir: 1}; }
  return {x: 500, y: PTOP, pose: 'cheer', ph: t * 7, dir: 1};
}
// B: takes the ladder shortcut
function ladderPoint(u) { return [lerp(LAD_B[0], LAD_T[0], u), lerp(LAD_B[1], LAD_T[1], u)]; }
function stateB(t) {
  if (t < 5.6) return {x: 850, y: GROUND, pose: t < 2 ? 'stand' : 'look', ph: t * 2.4, dir: -1};
  if (t < 6) { const k = ease(seg(t, 5.6, 6)); return {x: lerp(850, 960, k), y: GROUND, pose: 'stand', ph: t * 9, dir: -1}; }
  if (t < 11.4) {
    const u = kf(t, [[6, 0], [10.2, .86], [11.4, .9]], (k) => k * k * (1.6 - .6 * k));
    const [x, y] = ladderPoint(u);
    return {x: x - 6, y, pose: 'climb', ph: t * (t < 10.2 ? 15 : 3), dir: -1};
  }
  if (t < 12.3) { const k = seg(t, 11.4, 12.3); const [x0, y0] = ladderPoint(.9);
    return {x: x0 + 200 * k, y: y0 + (GROUND - y0) * k * k, pose: 'fall', ph: t * 12, dir: -1, rot: -260 * k}; }
  return {x: 900, y: GROUND, pose: 'flat', dir: 1, rot: 0};
}
// crowd on the left cliff
function crowdPose(t, i) {
  const ph = t * 9 + i * .9;
  if (t < 2) return {pose: 'stand', ph};
  if (t < 5) return {pose: 'point', ph, dir: 1};
  if (t < 11.4) return {pose: t < 6 ? 'point' : 'cheer', ph: t * 11 + i, dir: 1};
  if (t < 16.8) return {pose: 'still', ph: 0, dir: 1};
  return {pose: 'clap', ph: t * 22 + i * 1.3, dir: 1};
}
function crowd(t) {
  let h = '';
  const xs = [30, 78, 126, 174, 222, 266];
  xs.forEach((x, i) => {
    const s = .8, col = i === xs.length - 1 ? 'var(--ink)' : 'var(--crowd)', baseOp = .55 + i * .08;
    const moving = !(t >= 11.4 && t < 16.8);
    if (moving && t > 2) for (const [dt, o] of [[.12, .18], [.06, .32]]) { const c = crowdPose(t - dt, i); h += fig(x - dt * 60, 1180, {...c, s, col, op: o * baseOp}); }
    h += fig(x, 1180, {...crowdPose(t, i), s, col, op: baseOp});
  });
  return h;
}

/* ---------- ladder ---------- */
function ladder(t) {
  if (t < 4.35) return '';
  let h = '';
  const drop = seg(t, 4.35, 5.0), land = seg(t, 5.0, 5.35);
  const off = (1 - easeOut(Math.min(1, drop * 1.0))) * -1400 + Math.sin(land * Math.PI) * -22;
  const L = Math.hypot(LAD_T[0] - LAD_B[0], LAD_T[1] - LAD_B[1]);
  const ang = Math.atan2(LAD_T[1] - LAD_B[1], LAD_T[0] - LAD_B[0]) * 180 / Math.PI;
  const rungs = 12, w = 64;
  const draw = (from, to, extra = '') => {
    let g = `<rect x="${from}" y="${-w / 2}" width="${to - from}" height="10" rx="4" fill="#C8873A"/><rect x="${from}" y="${w / 2 - 10}" width="${to - from}" height="10" rx="4" fill="#C8873A"/>`;
    for (let r = 1; r <= rungs; r++) { const px = r * L / (rungs + 1); if (px > from && px < to) g += `<rect x="${px - 5}" y="${-w / 2}" width="10" height="${w}" fill="#A86A2A"/>`; }
    return `<g ${extra}>${g}</g>`;
  };
  const snap = 11.4;
  let body;
  if (t < snap) body = draw(0, L);
  else { const k = seg(t, snap, 12.6);
    body = draw(0, L * .55) + draw(L * .55, L, `transform="translate(${L * .55} 0) rotate(${(70 * k * k).toFixed(1)}) translate(${(-L * .55).toFixed(1)} ${(900 * k * k).toFixed(1)})"`); }
  // label on the ladder
  const glow = .7 + .3 * Math.sin(t * 8);
  const lbl = `<g transform="translate(${L * .28} 0) rotate(${-ang + 180 - 180})"></g>`;
  h += `<g transform="translate(${LAD_B[0]} ${LAD_B[1] + off}) rotate(${ang.toFixed(2)})">${body}</g>`;
  // tag "لوت كبير" (stays upright, sits on lower ladder)
  if (t > 5.0) {
    const k = back(seg(t, 5.05, 5.45)), [lx, ly] = ladderPoint(.1);
    h += `<g transform="translate(${lx - 60} ${ly - 40}) scale(${k.toFixed(3)}) rotate(-6)"><rect x="-120" y="-42" width="240" height="84" rx="42" fill="var(--accent)" stroke="#000" stroke-width="7" opacity="${glow.toFixed(2)}"/><text x="0" y="16" text-anchor="middle" font-family="Alexandria" font-weight="900" font-size="44" fill="#111">لوت كبير</text></g>`;
  }
  // cracks
  if (t > 10.4 && t < snap + .1) {
    const k = seg(t, 10.4, 11.4); const [cx, cy] = ladderPoint(.55);
    const n = Math.ceil(k * 6);
    for (let i = 0; i < n; i++) { const a = hash(i + 3) * 360, l = 30 + 50 * k;
      h += `<path d="M${cx} ${cy} l${(Math.cos(a) * l * .5).toFixed(0)} ${(Math.sin(a) * l * .5).toFixed(0)} l${(Math.cos(a + .6) * l * .5).toFixed(0)} ${(Math.sin(a + .6) * l * .5).toFixed(0)}" stroke="var(--bad)" stroke-width="7" stroke-linecap="round" fill="none"/>`; }
  }
  // splinters after snap
  if (t >= snap && t < 12.8) { const k = seg(t, snap, 12.8); const [cx, cy] = ladderPoint(.55);
    for (let i = 0; i < 9; i++) { const a = hash(i + 20) * 6.28, v = 200 + hash(i + 40) * 300;
      h += `<rect x="${(cx + Math.cos(a) * v * k).toFixed(0)}" y="${(cy + Math.sin(a) * v * k + 600 * k * k).toFixed(0)}" width="22" height="7" fill="#C8873A" transform="rotate(${(a * 90 + k * 400).toFixed(0)} ${(cx + Math.cos(a) * v * k).toFixed(0)} ${(cy + Math.sin(a) * v * k + 600 * k * k).toFixed(0)})" opacity="${(1 - k).toFixed(2)}"/>`; } }
  return h;
}

/* ---------- pillar labels + flag ---------- */
function labels(t, ay) {
  let h = '';
  STEPS.forEach(([txt, y], i) => {
    const passed = ay < y + 40 && t > 2;
    const k = passed ? 1 : 0;
    h += `<path d="M${PX1 - 10} ${y - 44} L${PX0 + 20} ${y - 44}" stroke="${k ? 'var(--accent)' : '#444'}" stroke-width="3"/>`;

  return h;
}

/* ---------- camera ---------- */
function camera(t) {
  let [cx, cy, z] = kf(t, [[0, [540, 1090, 1]], [2, [540, 1220, 1.1]], [6, [600, 1240, 1.12]], [10.2, [640, 940, 1.22]], [11.4, [650, 960, 1.26]], [12.4, [720, 1300, 1.14]], [13.4, [520, 1160, 1.08]], [16.6, [520, 820, 1.14]], [17.6, [540, 1000, 1.0]], [20, [540, 1000, 1.0]]]);
  let sx = 0, sy = 0;
  const shake = (a, b, amp) => { if (t > a && t < b) { const k = 1 - seg(t, a, b); sx += Math.sin(t * 91) * amp * k; sy += Math.cos(t * 77) * amp * k; } };
  shake(5.0, 5.4, 18); shake(10.5, 11.4, 6); shake(11.4, 11.7, 22); shake(12.3, 12.9, 40);
  return `translate(${(540 + sx).toFixed(1)} ${(960 + sy).toFixed(1)}) scale(${z.toFixed(4)}) translate(${(-cx).toFixed(1)} ${(-cy).toFixed(1)})`;
}

/* ---------- render ---------- */
function render(t) {
  t = clamp(t, 0, DUR);
  const A = stateA(t), B = stateB(t);
  let h = world(t) + labels(t, A.y) + crowd(t) + ladder(t);
  if (t >= 12.3 && t < 12.9) { const k = seg(t, 12.3, 12.9); h += `<ellipse cx="900" cy="${GROUND}" rx="${(60 + 200 * k).toFixed(0)}" ry="${(14 + 30 * k).toFixed(0)}" fill="#777" opacity="${(.6 * (1 - k)).toFixed(2)}"/>`; }
  h += fig(B.x, B.y, {...B, op: t > 12.3 ? .55 : 1});
  h += fig(A.x, A.y, A);
  h += bubbles(t);
  $('cam').setAttribute('transform', camera(t));
  $('cam').innerHTML = h;
  $('flash').setAttribute('opacity', (t > 11.4 && t < 12.6 ? .35 * (1 - seg(t, 11.4, 12.6)) + (t > 12.3 && t < 12.5 ? .25 : 0) : 0).toFixed(3));
  $('hud').innerHTML = hud(t);
}
window.render = render;
window.__settle = () => document.fonts.ready;

/* ---------- preview player ---------- */
const vo = $('vo'), scrub = $('scrub');
let playing = false;
$('play').onclick = () => { if (vo.paused) { if (vo.currentTime >= DUR - .05) vo.currentTime = 0; vo.play(); } else vo.pause(); };
vo.onplay = () => { playing = true; $('play').textContent = '❚❚ إيقاف'; loop(); };
vo.onpause = () => { playing = false; $('play').textContent = '▶ تشغيل'; };
scrub.oninput = () => { vo.currentTime = +scrub.value; render(+scrub.value); };
function loop() { const t = vo.currentTime; render(t); scrub.value = t; $('tc').textContent = t.toFixed(1); if (playing) requestAnimationFrame(loop); }
document.fonts.ready.then(() => render(0));
render(0);
</script>
