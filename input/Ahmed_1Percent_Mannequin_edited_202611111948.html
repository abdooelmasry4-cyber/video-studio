:root{--accent:#F5C518;--bad:#E63946;--good:#22C55E;--room:#3A3D47;--scr:#DCEBF5}
html,body{margin:0;background:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Tajawal',sans-serif;color:#fff}
#reel{position:relative;width:min(92vw,calc(86vh*9/16));aspect-ratio:9/16;background:#000;overflow:hidden;border-radius:14px}
#reel svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{display:flex;gap:10px;align-items:center;font-size:14px}
#ui button{font:900 14px Tajawal,sans-serif;padding:8px 18px;border-radius:999px;border:0;background:var(--accent);color:#111;cursor:pointer}
#ui input{width:min(60vw,360px)}

body{display:grid!important;grid-template-columns:auto minmax(0,380px);grid-template-rows:auto auto;justify-content:center;align-content:start;padding:16px;gap:12px 20px!important}
#reel{grid-column:1;grid-row:1}#ui{grid-column:1;grid-row:2;justify-content:center}#ed{grid-column:2;grid-row:1/3}
@media (max-width:820px){body{grid-template-columns:1fr}#reel{justify-self:center}#ed{grid-column:1;grid-row:3;width:100%!important}}
#ed{width:min(100%,380px);max-height:92vh;overflow:auto;background:#1b1c21;border:1px solid #2c2e36;border-radius:16px;padding:14px 16px;font:500 14px Tajawal,system-ui,sans-serif;color:#e8e8ea;direction:rtl}
#ed h3{font:900 15px Tajawal,sans-serif;margin:14px 0 8px;color:var(--accent)}
#ed .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
#ed input[type=color]{width:46px;height:30px;border:0;border-radius:8px;background:none;padding:0;cursor:pointer}
#ed select,#ed input[type=text]{background:#26282f;color:#fff;border:1px solid #3a3d47;border-radius:8px;padding:6px 8px;font:500 13px Tajawal,sans-serif;min-width:150px}
#ed .tabs{display:flex;gap:6px;flex-wrap:wrap}
#ed .tabs button,#ed .btn{border:1px solid #3a3d47;background:#26282f;color:#fff;border-radius:999px;padding:6px 12px;font:700 13px Tajawal,sans-serif;cursor:pointer}
#ed .tabs button[aria-pressed=true]{background:var(--accent);color:#111;border-color:var(--accent)}
#ed .btn.main{background:var(--accent);color:#111;border:0;width:100%;padding:11px;font-size:15px;margin-top:10px}
#ed .sw{display:flex;gap:5px}#ed .sw i{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid #111}
#ed .note{color:#9a9ba3;font-size:12px;margin-top:8px;line-height:1.6}
</style>

const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const back = (k) => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const f1 = (n) => (+n).toFixed(1);
function kf(t, keys, fn = ease) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const [t0, v0] = keys[i - 1], [t1, v1] = keys[i]; return lerp(v0, v1, fn((t - t0) / (t1 - t0))); }
  return keys[keys.length - 1][1];
}

const CFG = JSON.parse(document.getElementById('cfg').textContent);
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = (c) => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k); return '#' + [f(r), f(g), f(b)].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join(''); }
const BLINK = {A: 0, B: .37, F1: .61, F2: .83, F3: .21};
const LOOK = {};
function buildLooks() { for (const k of Object.keys(CFG.chars)) { const c = CFG.chars[k]; LOOK[k] = Object.assign(LOOK[k] || {}, c, {skinD: shade(c.skin, -.14), lit: shade(c.skin, .45), blink: BLINK[k] ?? .5}); }
  const r = document.documentElement.style; for (const [k, v] of Object.entries(CFG.colors)) r.setProperty('--' + k, v); }
buildLooks();
const LA = LOOK.A, LB = LOOK.B, LF1 = LOOK.F1 || LOOK.A, LF2 = LOOK.F2 || LOOK.B;

  if (i === 1) { SPY.forEach(([x, y, kind], j) => h += spendIcon(kind, x, Y + y, k * .72, hitAt(t, hits(1, j))));
    const fill = clamp(plan(1).filter(e => e[3] === -1 && t > e[0] + .55).length / 4);
    h += `<g transform="translate(960 ${Y + 430}) scale(${k.toFixed(3)})"><rect x="-50" y="-150" width="100" height="22" rx="6" fill="#5b6170"/><rect x="-60" y="-128" width="120" height="150" rx="20" fill="#cfe6ff" opacity=".3" stroke="#e6f2ff" stroke-width="5"/>${Array.from({length: Math.round(fill * 8)}, (_, j) => `<rect x="-46" y="${4 - j * 16}" width="92" height="12" rx="2" fill="var(--money)" stroke="#1b5e20" stroke-width="2"/>`).join('')}</g>`;
    h += `<g opacity="${clamp(k).toFixed(2)}">${pill(740, Y + 490, TX('sp1'), 'var(--c2)', '#111', 24)}${pill(960, Y + 490, TX('save'), '#2a2c33', '#fff', 26)}</g>`; }
  if (i === 2) { const g = ease(seg(t, 3.4, 6.4)), pulse = hitAt(t, plan(2).filter(e => e[3] === -1 && e[0] > 9).map(e => e[0] + .55));
    let tree = '';

      for (let j = 0; j < Math.round(g * 22); j++) { const a = hash(j) * 6.28, r = 40 + hash(j + 9) * 110 * g; tree += bill(Math.cos(a) * r, -60 - 220 * g + Math.sin(a) * r * .6, a * 57 + Math.sin(t * 2 + j) * 8, .8 + .2 * g); } }
    h += `<g transform="translate(${TGT_X} ${Y + GROUND - 30}) scale(${(k * (1 + .08 * pulse)).toFixed(3)})">${tree}<path d="M-74 -66 L74 -66 L70 -46 L-70 -46Z" fill="#a0522d"/><path d="M-66 -46 L66 -46 L52 30 L-52 30Z" fill="#c0703a"/></g>` + txt(TGT_X, Y + GROUND + 60, TX('inv'), 34, 'var(--c3)');
    const ks = back(seg(t, 9.0, 9.35)), ka = seg(t, 9.0, 9.6);
    if (ks > 0) { h += spendIcon('coffee', 960, Y + 250, ks * .6, hitAt(t, hits(2, 9))) + `<g opacity="${clamp(ks).toFixed(2)}">${pill(960, Y + 330, TX('sp2'), 'var(--c2)', '#111', 22)}</g>`;
      h += `<path d="M450 ${Y + 360} Q600 ${Y + 300} ${TGT_X - 90} ${Y + 380}" stroke="var(--money)" stroke-width="7" fill="none" stroke-dasharray="380" stroke-dashoffset="${f1(380 * (1 - ka))}" stroke-linecap="round"/>`;
      h += `<path d="M450 ${Y + 330} Q700 ${Y + 160} 900 ${Y + 240}" stroke="var(--c2)" stroke-width="5" fill="none" stroke-dasharray="520" stroke-dashoffset="${f1(520 * (1 - ka))}" stroke-linecap="round"/>`;
      h += `<g opacity="${ka.toFixed(2)}">${pill(600, Y + 420, TX('reinv'), '#1b5e20', '#fff', 22)}</g>`; }

  return h;
}
function header(i, t) {

  const pct = ['90%', '9%', '1%'][i], col = ['var(--c1)', 'var(--c2)', 'var(--c3)'][i];
  return `<g transform="translate(540 ${rowY(i) + 90}) scale(${k.toFixed(3)}) rotate(${f1(jit(50 + i, 2))})" ${ST === 'neon' ? 'filter="url(#glow)"' : ''}>${txt(-120, 0, TX('people'), 56, 'var(--ink)')}${txt(110, 0, '‭' + pct + '‬', 72, col)}</g>`;
}
function rowBg(i, t) {
  const Y = rowY(i);
  let h = '';
  if (ST === 'mannequin') h += `<rect x="0" y="${Y + 140}" width="1080" height="${ROW_H - 140}" fill="url(#spot)"/><path d="M0 ${Y + GROUND + 4} L1080 ${Y + GROUND + 4}" stroke="#3a3a3a" stroke-width="3"/>`;
  if (ST === 'paper') { let d = `M0 ${Y + ROW_H}`; for (let x = 0; x <= 1080; x += 30) d += ` L${x} ${Y + ROW_H - 6 - hash(x + i * 9) * 14}`; h += `<rect x="0" y="${Y + GROUND}" width="1080" height="${ROW_H - GROUND}" fill="${['#E9C9B5', '#EFD9A8', '#CFE3C3'][i]}"/><path d="${d} L1080 ${Y + ROW_H + 20} L0 ${Y + ROW_H + 20}Z" fill="#fff" opacity=".7"/>`; }
  if (ST === 'neon') { h += `<path d="M0 ${Y + GROUND + 4} L1080 ${Y + GROUND + 4}" stroke="${['var(--c1)', 'var(--c2)', 'var(--c3)'][i]}" stroke-width="3" filter="url(#glow)" opacity=".8"/>`;
    for (let k = 1; k < 7; k++) h += `<path d="M${540 - k * 160} ${Y + GROUND + 4} L${540 - k * 300} ${Y + ROW_H}" stroke="${['var(--c1)', 'var(--c2)', 'var(--c3)'][i]}" stroke-width="2" opacity=".25"/><path d="M${540 + k * 160} ${Y + GROUND + 4} L${540 + k * 300} ${Y + ROW_H}" stroke="${['var(--c1)', 'var(--c2)', 'var(--c3)'][i]}" stroke-width="2" opacity=".25"/>`; }
  return h;
}
function render(t) {
  t = clamp(t, 0, DUR); NOW = t;
  let h = defs() + `<rect width="1080" height="1920" fill="var(--bg)"/>`;
  for (let i = 0; i < 3; i++) {
    let row = rowBg(i, t) + header(i, t) + target(i, t) + stack(i, t) + figure(i, t) + flights(i, t);
    if (i === 0) row += burst(STACK_X, rowY(0) + 380, t, 4.8, 10, 'var(--c1)', 60, 180);
    if (i === 2) row += burst(STACK_X, rowY(2) + 380, t, 11, 12, 'var(--accent)', 60, 200);
    const dim = i < 2 ? .6 * seg(t, 11, 11.6) : 0;
    if (dim > 0) row += `<rect x="0" y="${rowY(i)}" width="1080" height="${ROW_H}" fill="#000" opacity="${dim.toFixed(2)}"/>`;
    h += row;
    if (i < 2) h += `<path d="M0 ${rowY(i) + ROW_H} L1080 ${rowY(i) + ROW_H}" stroke="#2a2a2a" stroke-width="2"/>`;
  }
  if (t > 11) h += `<rect x="12" y="${rowY(2) + 8}" width="1056" height="${ROW_H - 16}" rx="24" fill="none" stroke="var(--c3)" stroke-width="8" opacity="${seg(t, 11, 11.5).toFixed(2)}"/>`;
  h += endCard(t);
  $('sv').innerHTML = h;
}

window.render = render;
window.__settle = () => document.fonts.ready;
const vo = $('vo'), scrub = $('scrub'); let playing = false;
$('play').onclick = () => { if (vo.paused) { if (vo.currentTime >= DUR - .05) vo.currentTime = 0; vo.play(); } else vo.pause(); };
vo.onplay = () => { playing = true; $('play').textContent = '❚❚ إيقاف'; loop(); };

document.fonts.ready.then(() => render(0));
render(0);
